<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Crumbly</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F6F0E6" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Crumbly" />
    <style>
      html, body { background-color: #F6F0E6; }
      input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 1.5px solid #B04E33; outline-offset: 2px; }
      input:focus:not(:focus-visible), textarea:focus:not(:focus-visible) { outline: none; }
      .boot { display: flex; flex: 1; align-items: center; justify-content: center; font-family: Georgia, serif; font-size: 28px; color: #2F4A3E; }
    </style>
    <style id="expo-reset">
      html, body { height: 100%; height: 100dvh; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; height: 100dvh; flex: 1; }
    </style>
  </head>
  <body>
    <noscript>Zet JavaScript aan om Crumbly te gebruiken.</noscript>
    <div id="root"><div class="boot">Crumbly</div></div>
  </body>
</html>
